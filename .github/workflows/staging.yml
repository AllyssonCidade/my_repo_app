name: Build For Staging
on:
  push:
    branches:
      - staging
jobs:
  build:
    name: Build For Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - name: Install Dependencies
        run: npm install
      - name: Build and Submit
        run: |
          echo "Building and submitting staging build..."
          npx expo build:android --distribution internal
          npx expo build:ios --distribution internal
